[package]
name = "tendril-cli"
description = "The tendril command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tendril"
path = "src/main.rs"

[dependencies]
tendril-core.workspace = true
tendril-engines = { path = "../tendril-engines" }
tendril-cluster = { path = "../tendril-cluster" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
indicatif = "0.18"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
owo-colors.workspace = true
sysinfo.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "http2"] }
dirs.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
