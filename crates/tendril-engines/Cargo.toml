[package]
name = "tendril-engines"
description = "Inference engines Tendril can run models with: detection, planning, launching and API translation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tendril-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "http2"] }
futures = "0.3"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
