[package]
name = "tendril-cluster"
description = "Tendril cluster: encrypted transport and tunnels, agents running inference engines, and OpenAI-compatible serving"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tendril-core.workspace = true
tendril-engines = { path = "../tendril-engines" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tokio = { version = "1", features = ["full"] }
snow = "0.10"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
rand = "0.9"
tracing = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
futures = "0.3"
async-stream = "0.3"
socket2 = { version = "0.5", features = ["all"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { workspace = true, features = ["stream", "multipart"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking"] }
