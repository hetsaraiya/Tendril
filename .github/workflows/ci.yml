name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # A real engine through Tendril: llama.cpp split across two agents, its
  # RPC traffic carried by Tendril's encrypted tunnels.
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build llama.cpp with RPC
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_RPC=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j 4 --target llama-server ggml-rpc-server
          echo /tmp/llama.cpp/build/bin >> "$GITHUB_PATH"
      - run: pip install gguf numpy && python tools/make_tiny_gguf.py /tmp/tiny.gguf
      - run: TENDRIL_E2E_GGUF=/tmp/tiny.gguf cargo test -p tendril-cluster --test engines -- --nocapture
